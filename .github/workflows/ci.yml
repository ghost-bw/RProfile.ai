name: ResumePro CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: TEMP - Force Failure for Testing
        run: exit 1

      # ---------- Backend ----------
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      # ---------- Frontend ----------
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
