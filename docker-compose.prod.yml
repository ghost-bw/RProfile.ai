version: '3.8'

services:
  # Database Service (MongoDB Cloud Atlas is recommended for production, but this container can be used for self-hosted DB)
  mongodb:
    image: mongo:6.0
    container_name: resumepro_db_prod
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-secretpassword}
    volumes:
      - mongo_data_prod:/data/db

  # Backend Service (Express Server)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumepro_backend_prod
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - mongodb
    volumes:
      - uploads_data_prod:/usr/src/app/uploads

  # Frontend Service (Vite React app served with Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: resumepro_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data_prod:
  uploads_data_prod:
