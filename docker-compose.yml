version: '3.8'

services:
  # Database Service (MongoDB)
  mongodb:
    image: mongo:6.0
    container_name: resumepro_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Backend Service (Express Server)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumepro_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/usr/src/app/uploads

  # Frontend Service (Vite React app served with Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: resumepro_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads_data:
